name: Public install and package checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Package and regression checks
        run: |
          python scripts/validate_package.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Non-UTF-8 locale
        if: runner.os == 'Linux'
        env:
          LC_ALL: C
          PYTHONUTF8: '0'
          PYTHONCOERCECLOCALE: '0'
        run: python scripts/validate_package.py
      - name: Manifest and interface metadata
        run: |
          python -m pip install PyYAML==6.0.3
          python - <<'PY'
          from pathlib import Path
          import yaml
          text = Path('SKILL.md').read_text(encoding='utf-8')
          assert text.startswith('---\n')
          manifest = yaml.safe_load(text.split('---', 2)[1])
          interface = yaml.safe_load(Path('agents/openai.yaml').read_text(encoding='utf-8'))
          assert manifest['name'] == 'playful-crayon-storybook-skill'
          assert isinstance(manifest['description'], str) and manifest['description'].strip()
          assert '$' + manifest['name'] in interface['interface']['default_prompt']
          print('PASS: canonical Skill name, description and invocation metadata')
          PY
      - name: Anonymous install from this public GitHub commit
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import urllib.request

          scratch = Path(tempfile.mkdtemp(prefix='public-skill-acceptance-'))
          helper = scratch / 'installer'
          helper.mkdir()
          upstream = '49f948faa9258a0c61caceaf225e179651397431'
          for filename in ('github_utils.py', 'install-skill-from-github.py'):
              url = f'https://raw.githubusercontent.com/openai/skills/{upstream}/skills/.system/skill-installer/scripts/{filename}'
              request = urllib.request.Request(url, headers={'User-Agent': 'public-skill-acceptance'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  (helper / filename).write_bytes(response.read())

          environment = dict(os.environ)
          for key in ('GITHUB_TOKEN', 'GH_TOKEN', 'SSH_AUTH_SOCK', 'GIT_ASKPASS'):
              environment.pop(key, None)
          destination = scratch / 'installed'
          name = 'playful-crayon-storybook-skill'
          subprocess.run([
              sys.executable, str(helper / 'install-skill-from-github.py'),
              '--repo', os.environ['GITHUB_REPOSITORY'], '--path', '.',
              '--ref', os.environ['GITHUB_SHA'], '--name', name,
              '--method', 'download', '--dest', str(destination),
          ], env=environment, check=True, timeout=180)

          installed = destination / name
          tracked = subprocess.check_output(['git', 'ls-files', '-z'], text=True).rstrip('\0').split('\0')
          for relative in tracked:
              assert (installed / relative).read_bytes() == Path(relative).read_bytes(), relative
          subprocess.run([sys.executable, str(installed / 'scripts/validate_package.py')], check=True)
          subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_*.py', '-v'], cwd=installed, check=True)
          print(f'PASS: anonymous official installer; all {len(tracked)} tracked files match public commit {os.environ["GITHUB_SHA"]}')
          PY
